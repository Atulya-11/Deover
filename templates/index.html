<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Saver</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#eef1f6; --mute:#9aa3b2; --accent:#4f8cff; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:520px; padding-top:24px; }
  h1 { font-size:24px; margin:0 0 4px; }
  p.sub { color:var(--mute); margin:0 0 20px; font-size:14px; }
  .box { display:flex; gap:8px; }
  input { flex:1; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; min-width:0; }
  button { border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; padding:14px 18px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .card { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:none; }
  .card img { width:100%; display:block; aspect-ratio:16/9; object-fit:cover; background:#000; }
  .meta { padding:14px; }
  .title { font-weight:600; line-height:1.35; }
  .small { color:var(--mute); font-size:13px; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 14px; }
  .chip { padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:14px; font-weight:500; }
  .chip.on { background:var(--accent); border-color:var(--accent); }
  .dl { display:block; margin:0 14px 14px; text-align:center; text-decoration:none; background:var(--ok); color:#06210f; font-weight:700; padding:14px; border-radius:12px; }
  .err { margin-top:16px; color:var(--err); font-size:14px; display:none; }
  .note { margin-top:28px; color:var(--mute); font-size:12px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>Video Saver</h1>
  <p class="sub">YouTube, Instagram, Facebook ka public video link paste karo.</p>

  <div class="box">
    <input id="url" type="url" placeholder="Link yahan paste karo" autocomplete="off">
    <button id="go">Fetch</button>
  </div>
  <div class="err" id="err"></div>

  <section class="card" id="card">
    <img id="thumb" alt="">
    <div class="meta">
      <div class="title" id="title"></div>
      <div class="small" id="info"></div>
    </div>
    <div class="chips" id="chips"></div>
    <a class="dl" id="dl" href="#">Download</a>
  </section>

  <p class="note">Sirf public videos. Private account ke video nahi chalenge. Sirf apne ya permission wale videos download karo.</p>
</main>

<script>
const $ = id => document.getElementById(id);
let selected = null;

function fmtDur(s){ if(!s) return ""; const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function setDl(){
  $("dl").href = "/api/download?url=" + encodeURIComponent($("url").value.trim()) + "&quality=" + selected;
}

function renderChips(qs){
  const chips = $("chips"); chips.innerHTML = "";
  const opts = qs.map(q => ({v:String(q), t:q+"p"})).concat([{v:"audio", t:"MP3 audio"}]);
  selected = opts[Math.min(1, opts.length-2)]?.v || opts[0].v;
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "chip" + (o.v === selected ? " on" : "");
    b.textContent = o.t;
    b.onclick = () => {
      selected = o.v;
      [...chips.children].forEach(c => c.classList.remove("on"));
      b.classList.add("on"); setDl();
    };
    chips.appendChild(b);
  });
  setDl();
}

$("go").onclick = async () => {
  $("err").style.display = "none"; $("card").style.display = "none";
  const url = $("url").value.trim();
  if(!url) return;
  $("go").disabled = true; $("go").textContent = "...";
  try {
    const r = await fetch("/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "Error");
    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title || "Video";
    $("info").textContent = [d.uploader, fmtDur(d.duration)].filter(Boolean).join(" • ");
    renderChips(d.qualities || []);
    $("card").style.display = "block";
  } catch(e) {
    $("err").textContent = e.message; $("err").style.display = "block";
  } finally {
    $("go").disabled = false; $("go").textContent = "Fetch";
  }
};
$("url").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
